name: inspect-official-url-buildconfig-0811

on:
  push:
    branches: [custom-mpv-genre]
    paths: [.github/workflows/inspect-official-url-buildconfig-0811.yml]

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decompile official 0.8.11 APK and print URL fields only
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o /tmp/nuvio.apk https://github.com/NuvioMedia/NuvioTV/releases/download/0.8.11-beta/app-full-arm64-v8a-release.apk
          curl -L --fail --retry 3 -o /tmp/jadx.zip https://github.com/skylot/jadx/releases/download/v1.5.3/jadx-1.5.3.zip
          unzip -q /tmp/jadx.zip -d /tmp/jadx-bin
          /tmp/jadx-bin/bin/jadx --no-res -d /tmp/nuvio-src /tmp/nuvio.apk >/dev/null 2>&1 || true
          find /tmp/nuvio-src/sources -type f -name 'BuildConfig.java' -path '*com/nuvio/tv*' -print -exec awk '
            /public static final String/ && ($0 ~ /_URL/ || $0 ~ /_BASE_URL/ || $0 ~ /REDIRECT_URI/) {
              print
            }
          ' {} \;
