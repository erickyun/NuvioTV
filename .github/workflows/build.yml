name: build

on:
  workflow_dispatch:
  push:
    branches:
      - dev
    paths:
      - ".github/workflows/build.yml"

permissions:
  contents: write

concurrency:
  group: custom-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      CI_USE_DEBUG_SIGNING: "true"

    steps:
      - name: Check out dev
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure official Nuvio public backend
        shell: bash
        run: |
          set -euo pipefail
          discovery="${RUNNER_TEMP}/nuvio-discovery.json"
          curl --fail --silent --show-error --location --retry 3 \
            https://api.nuvio.tv/.well-known/nuvio \
            -o "$discovery"

          python3 - "$discovery" <<'PY'
          import json
          import sys
          from pathlib import Path

          data = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          backend = str(data.get("backend_url", "")).strip().rstrip("/")
          key = str(data.get("publishable_key", "")).strip()
          if not backend.startswith("https://"):
              raise SystemExit("Official backend discovery returned an invalid backend_url")
          if len(key) < 20:
              raise SystemExit("Official backend discovery returned an invalid publishable_key")

          lines = [
              f"NUVIO_SUPABASE_URL={backend}",
              f"NUVIO_SUPABASE_ANON_KEY={key}",
              "NUVIO_SUPABASE_FALLBACK_URL=",
              f"AVATAR_PUBLIC_BASE_URL={backend}/storage/v1/object/public/avatars",
              "TV_LOGIN_WEB_BASE_URL=https://nuvio.tv/tv-login",
              "INTRODB_API_URL=https://api.introdb.app/",
              "SUPPORTERS_API_BASE_URL=https://nuvio.tv/",
              "SUPPORT_URL=https://nuvio.tv/support",
              "PLAYBACK_REPORTS_BASE_URL=https://nuvio.tv/",
          ]
          Path("local.properties").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

          # Verify presence without printing the public key value into Actions logs.
          grep -Eq '^NUVIO_SUPABASE_URL=https://.+' local.properties
          grep -Eq '^NUVIO_SUPABASE_ANON_KEY=.{20,}$' local.properties
          echo "Official Nuvio backend configuration loaded."

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build full release APK
        run: ./gradlew :app:assembleFullRelease --stacktrace

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: build
          path: app/build/outputs/apk/full/release/*.apk
          if-no-files-found: error

      - name: Create GitHub release
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find app/build/outputs/apk/full/release -maxdepth 1 -type f -name '*.apk' -print | sort)
          if (( ${#apks[@]} == 0 )); then
            echo "No APK produced." >&2
            exit 1
          fi
          tag="build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" \
            --target "$(git rev-parse HEAD)" \
            --title "build" \
            --notes $'Crash-fixed build.\n\nFix: the recreated fork had no copied Actions secrets, so the previous release was built with an empty Nuvio backend URL/key and could crash during SupabaseClient creation at startup. This build resolves the official backend URL and public client key from https://api.nuvio.tv/.well-known/nuvio during CI before compiling.' \
            "${apks[@]}"
