name: apply-custom-source

on:
  push:
    branches: [build-final]
    paths: [.github/workflows/apply-custom-source.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build-final
          fetch-depth: 1
      - name: Apply only requested source additions
        run: |
          set -euo pipefail
          python3 .github/scripts/repair_custom_patch_helper.py
          python3 .github/scripts/apply_custom_mpv_genre.py
          git diff --check
          git status --short
      - name: Commit verified source only
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-custom-source.yml
          rm -f .github/scripts/apply_custom_mpv_genre.py
          rm -f .github/scripts/repair_custom_patch_helper.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/nuvio/tv/data/local/MpvVideoProcessingSettings.kt \
            app/src/main/java/com/nuvio/tv/data/local/PlayerSettingsDataStore.kt \
            app/src/main/java/com/nuvio/tv/core/sync/ProfileSettingsSyncService.kt \
            app/src/main/java/com/nuvio/tv/ui/screens/settings/PlaybackSettingsViewModel.kt \
            app/src/main/java/com/nuvio/tv/ui/screens/settings/PlaybackMpvVideoProcessingSettings.kt \
            app/src/main/java/com/nuvio/tv/ui/screens/settings/PlaybackSettingsSections.kt \
            app/src/main/java/com/nuvio/tv/ui/screens/settings/PlaybackSettingsScreen.kt \
            app/src/main/java/com/nuvio/tv/ui/screens/player/NuvioMpvSurfaceView.kt \
            app/src/main/java/com/nuvio/tv/ui/screens/player/PlayerRuntimeController.kt \
            app/src/main/java/com/nuvio/tv/ui/screens/player/PlayerRuntimeControllerInitialization.kt \
            app/src/main/java/com/nuvio/tv/ui/screens/player/PlayerRuntimeControllerMpv.kt \
            app/src/main/java/com/nuvio/tv/ui/screens/player/PlayerRuntimeControllerObservers.kt \
            app/src/main/java/com/nuvio/tv/ui/screens/player/PlayerUiState.kt \
            app/src/main/java/com/nuvio/tv/ui/screens/player/PlayerRuntimeControllerMetadata.kt \
            app/src/main/java/com/nuvio/tv/ui/screens/player/ParentalGuideOverlay.kt \
            app/src/main/java/com/nuvio/tv/ui/screens/player/PlayerScreen.kt \
            app/src/main/res/values/strings.xml
          git add -u .github/workflows/apply-custom-source.yml .github/scripts/apply_custom_mpv_genre.py .github/scripts/repair_custom_patch_helper.py
          git diff --cached --check
          git commit -m "Add MPV video processing controls and genre overlay"
          git push origin HEAD:build-final
